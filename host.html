<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderatör · Sidar Quiz</title>
  <link rel="icon" href="assets/sprites/front_idle.png">
  <link rel="stylesheet" href="css/style.css?v=2026.11.19b">
</head>
<body class="host">
  <main id="host-wrap">
    <div class="crt"><canvas id="stage" width="960" height="540"></canvas></div>
    <div id="bar">
      <span id="status">Bağlanıyor…</span>
      <label class="btn ghost" id="loadLabel" hidden>
        Soru yükle (.json)
        <input type="file" id="fileInput" accept=".json,application/json" hidden>
      </label>
      <button class="btn" id="btnStart" hidden disabled>Oyunu başlat</button>
      <button class="btn alt" id="btnConfirm" hidden>Onayla · sonuçlar</button>
      <button class="btn" id="btnNext" hidden>Devam</button>
      <button class="btn" id="btnRestart" hidden>Yeni oyun</button>
      <span class="bar-sep"></span>
      <button class="btn ghost small" id="btnPause" hidden title="Duraklat / devam (P)">Duraklat</button>
      <button class="btn ghost small" id="btnTime" hidden title="Süreye 10 saniye ekle (T)">+10 sn</button>
      <button class="btn ghost small" id="btnSkip" hidden title="Soruyu puansız atla (S)">Atla</button>
      <button class="btn ghost small" id="btnLock" title="Yeni oyuncuların katılımını kilitle (L)">Katılım: açık</button>
      <button class="btn ghost small" id="btnSound" title="Ses (M)">Ses: açık</button>
    </div>
  </main>
  <script src="vendor/peerjs.min.js?v=2026.11.19b"></script>
  <script src="vendor/qrcode.js?v=2026.11.19b"></script>
  <script src="js/config.js?v=2026.11.19b"></script>
  <script src="js/common.js?v=2026.11.19b"></script>
  <script src="vendor/zzfx.js?v=2026.11.19b"></script>
  <script src="js/audio.js?v=2026.11.19b"></script>
  <script src="js/questions.js?v=2026.11.19b"></script>
  <script src="js/host.js?v=2026.11.19b"></script>
</body>
</html>
