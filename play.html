<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1c2c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Katıl · Sidar Quiz</title>
  <link rel="icon" href="assets/sprites/front_idle.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="play">
  <!-- QR'sız açılırsa -->
  <section id="noroom" class="screen info" hidden>
    <img src="assets/sprites/front_idle.png" alt="" class="hero">
    <h1>SIDAR<br>QUIZ</h1>
    <div class="window"><p>Oyuna katılmak için büyük ekrandaki <strong>QR kodu</strong> telefonunun kamerasıyla okut.</p></div>
  </section>

  <!-- 1. adım: karakter seçme -->
  <section id="select" class="screen info" hidden>
    <p class="step">1/2</p>
    <h2 class="title">KARAKTERINI SEÇ</h2>
    <div id="charGrid" role="listbox" aria-label="Karakterler"></div>
    <p id="charName" class="char-name"></p>
    <button class="btn big" id="pickBtn" type="button">SEÇ</button>
  </section>

  <!-- 2. adım: isim yazma -->
  <section id="join" class="screen info" hidden>
    <p class="step">2/2</p>
    <h2 class="title">ADINI YAZ</h2>
    <div class="preview">
      <img id="preview" alt="" src="assets/sprites/front_idle.png">
    </div>
    <form id="joinForm" autocomplete="off">
      <input id="name" maxlength="12" placeholder="ADIN" aria-label="Adın" required>
      <button class="btn big alt" id="joinBtn" type="submit">KATIL</button>
      <button class="btn ghost" id="backBtn" type="button">GERI</button>
      <p id="joinError" class="error" role="alert"></p>
    </form>
  </section>

  <!-- Dik tutulursa -->
  <section id="rotate" class="screen info" hidden>
    <svg class="rotate-icon" viewBox="0 0 24 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="2" y="3" width="20" height="11" fill="#f4f4f4"/>
      <rect x="3" y="4" width="18" height="9" fill="#29366f"/>
      <rect x="5" y="6" width="4" height="4" fill="#94b0c2"/>
      <rect x="17" y="7" width="2" height="2" fill="#b13e53"/>
      <rect x="10" y="5" width="6" height="7" fill="#41a6f6"/>
    </svg>
    <p class="press blink">TELEFONUNU YAN ÇEVIR</p>
    <p class="hint">Oyun yatay ekranda oynanır.</p>
  </section>

  <!-- Yatay el konsolu -->
  <section id="pad" class="console" hidden>
    <div class="side left">
      <div class="dpad">
        <button class="ctl dp up" data-key="j" aria-label="Zıpla">
          <svg viewBox="0 0 7 4" shape-rendering="crispEdges"><path d="M3 0h1v1h1v1h1v1h1v1H0V3h1V2h1V1h1z"/></svg>
        </button>
        <button class="ctl dp left" data-key="l" aria-label="Sola git">
          <svg viewBox="0 0 4 7" shape-rendering="crispEdges"><path d="M0 3h1V2h1V1h1V0h1v7H3V6H2V5H1V4H0z"/></svg>
        </button>
        <span class="dp mid"></span>
        <button class="ctl dp right" data-key="r" aria-label="Sağa git">
          <svg viewBox="0 0 4 7" shape-rendering="crispEdges"><path d="M0 0h1v1h1v1h1v1h1v1H3v1H2v1H1v1H0z"/></svg>
        </button>
        <span class="dp down"></span>
      </div>
    </div>

    <div class="bezel">
      <div class="bezel-top"><span class="led"></span><span>POWER</span></div>
      <div class="lcd">
        <header id="me">
          <span id="meDot"></span>
          <span id="meChar"></span>
          <strong id="meName"></strong>
          <span id="meScore">000000</span>
        </header>
        <div id="card">
          <div id="badge"></div>
          <div class="msg">
            <p id="msgBig"></p>
            <p id="msgSmall"></p>
          </div>
        </div>
      </div>
      <p class="brand">SIDAR <span>QUIZ</span></p>
    </div>

    <div class="side right">
      <div class="abtn-wrap">
        <button class="ctl abtn" data-key="j" aria-label="Zıpla">A</button>
        <span class="abtn-label">ZIPLA</span>
      </div>
      <div class="grille" aria-hidden="true"></div>
    </div>
  </section>

  <script src="vendor/peerjs.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
